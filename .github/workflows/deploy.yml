name: Deploy to Robot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Pull latest code
        run: |
          cd ~/RobotProd
          git fetch origin main
          git reset --hard origin/main

      - name: Restart robot stack
        run: |
          cd ~/RobotProd
          docker compose down robot || true
          # Пересобираем образ только если изменился Dockerfile или docker-compose.yml.
          # Исходный код монтируется как volume и собирается colcon при старте контейнера,
          # поэтому перестраивать образ при каждом пуше не нужно (и не работает без интернета).
          if git diff HEAD~1 --name-only 2>/dev/null | grep -qE '^(Dockerfile|docker-compose\.yml)'; then
            # docker build always tries to pull ros:jazzy-ros-base manifest from
            # Docker Hub — even with a local cache — and the robot has no Docker Hub
            # access. Instead: extract apt packages from Dockerfile, install into a
            # temp container, commit as new image. Already-installed packages are no-op.
            PKGS=$(grep -E '^\s+(ros-jazzy-|python3-)' Dockerfile | tr -d ' \\' | grep -v '^#' | tr '\n' ' ')
            docker run --name _apt_upgrade robotprod-robot:latest \
              bash -c "apt-get update -qq && apt-get install -y $PKGS"
            docker commit _apt_upgrade robotprod-robot:latest
            docker rm _apt_upgrade
          fi
          docker compose up -d robot
